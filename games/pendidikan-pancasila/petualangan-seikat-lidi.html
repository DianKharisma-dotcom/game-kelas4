<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Petualangan Seikat Lidi</title>
<style>
:root{--bg:#fff3dc;--ink:#1d2a44;--card:#fff;--mut:#5b6785;--ac:#e76f51;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2e;--ink:#f6f0e4;--card:#1d2b47;--mut:#a9b4cf}}
:root[data-theme="dark"]{--bg:#0f1a2e;--ink:#f6f0e4;--card:#1d2b47;--mut:#a9b4cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#st{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:flex;flex-direction:column;padding:26px 48px;box-sizing:border-box;gap:16px}
#sb{display:flex;gap:12px;height:104px;flex:none}#sb:empty{display:none}
.tm{flex:1;min-width:0;border-radius:18px;color:#fff;padding:8px 14px;display:flex;flex-direction:column;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tm b{font-size:28px;white-space:nowrap}.tm span{display:flex;align-items:flex-end;height:40px;gap:2px;overflow:hidden;margin-top:4px}
.tm i{width:7px;height:36px;border-radius:4px;background:#ffe08a;flex:none}
.tm em{position:absolute;right:14px;top:6px;font:900 44px system-ui;font-style:normal}
#mn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;min-height:0}
.big{font-size:140px}.t{font-size:92px;font-weight:900}.s{font-size:38px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
.btn{font:800 44px system-ui,"Segoe UI",sans-serif;padding:22px 56px;border:0;border-radius:30px;background:var(--ac);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25);cursor:pointer}
.btn.g{background:#457b9d}
.btn:active,.op:active,.rc:active,.tl:active,.zn:active{transform:translateY(5px)}
.rc{width:400px;height:350px;border:0;border-radius:36px;background:var(--card);color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:inherit;cursor:pointer}
.rc span{font-size:116px}.rc b{font-size:42px;padding:0 16px}.rc small{font-size:30px;color:var(--mut)}.rc.dn{opacity:.6}
.pill{color:#fff;font-size:44px;padding:12px 44px;border-radius:60px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.q{font-size:62px;font-weight:800;max-width:1650px;line-height:1.2}
.og{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:1740px}
.op{font:700 46px system-ui,sans-serif;display:flex;align-items:center;gap:22px;text-align:left;padding:18px 30px;min-height:130px;border:0;border-radius:28px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25);cursor:pointer}
.op b{background:rgba(255,255,255,.3);border-radius:50%;width:76px;height:76px;flex:none;display:grid;place-items:center;font-size:46px}
.o0{background:#e63946}.o1{background:#2a9d8f}.o2{background:#d88a00}.o3{background:#5a67d8}
.cor{outline:12px solid #38b000}.bad{opacity:.35}
.card{background:var(--card);color:var(--ink);font-size:58px;font-weight:800;padding:32px 60px;border-radius:30px;box-shadow:0 10px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab;max-width:1550px;position:relative;z-index:5}
.card.dg{z-index:9;box-shadow:0 30px 40px rgba(0,0,0,.3)}
.zs{display:flex;gap:50px}
.zn{width:790px;height:250px;border-radius:40px;display:grid;place-items:center;font-size:54px;font-weight:900;color:#fff;border:8px dashed rgba(255,255,255,.75);box-shadow:0 8px 0 rgba(0,0,0,.2);box-sizing:border-box}
.z0{background:#2a9d8f}.z1{background:#e76f51}.hint{font-size:34px;color:var(--mut)}
.ans{min-height:120px;font-size:60px;font-weight:800;border-bottom:8px dashed var(--mut);padding:0 40px;min-width:1100px}
.tl{font:800 56px system-ui,sans-serif;padding:20px 40px;border:0;border-radius:24px;background:#ffb703;color:#222;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.tl:disabled{opacity:.25}.shk{animation:sk .4s}
@keyframes sk{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.fbr{display:flex;align-items:center;gap:36px;font-size:44px;font-weight:800}.ok{color:#2b9348}.no{color:#d62828}
.tc{flex:1 1 340px;max-width:430px;color:#fff;border-radius:28px;padding:16px 22px;text-align:left;font-size:27px;animation:pop .5s both;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.tc h3{margin:0 0 8px;font-size:40px}.tc div{padding:2px 0}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pd{display:flex;align-items:center;gap:30px;font-size:40px;font-weight:800;color:#fff;width:1200px;padding:6px 40px;margin-bottom:-10px;border-radius:30px;box-sizing:border-box}.pd span{flex:1;text-align:left}
.corner{position:absolute;bottom:14px;width:60px;height:60px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:28px;opacity:.7}
.at{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:1800px}.ch{font:700 26px system-ui,sans-serif;height:66px;border:0;border-radius:18px;background:#2a9d8f;color:#fff;padding:0 14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.ch.ab{background:#6b7280;text-decoration:line-through;opacity:.7}
</style></head><body><div id="st"><div id="sb"></div><div id="mn"></div>
<button class="corner" style="left:14px" onclick="home()" title="Awal">🏠</button><button class="corner" style="right:14px" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()" title="Layar penuh">⛶</button></div>
<script>
const N=["Gede Adhyastha Prasaja","Gede Rama Prandangka","I Gede Rudi Sedaya Tana","I Kadek Vaden Anagata Mapendra","I Komang Tri Esa Raditya","I Wayan Bayu Sutha Pradnyana","Kadek Edi Saputra","Kadek Marsa Sukertia Lestari","Komang Abhi Chandra Saputra","Komang Bunga Widya Kirana","Komang Deva Antara","Luh Ayu Desita Dewi","Made Bramasta Wijaya Putra Wimaz","Made Wahana Sucita Putra","Nengah Alit Widiantari","Ngurah Komang Agus Klakan","Ni Ketut Ayu Anggita Sugi Antari","Putu Agus Wira Pratama","Putu Aletta Aristya Putri","Putu Eva Sardiana","Putu Satya Aryanata"];
const TN=[["Kecak","#d62828"],["Saman","#d9731a"],["Wayang","#188f84"],["Pendet","#7b2cbf"],["Reog","#1d6fb8"],["Tor-Tor","#c2185b"],["Jaipong","#4f8a2b"]];
const $=s=>document.getElementById(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={n:5,T:[],sc:[],p:[],turn:0,done:{},abs:{},sh:0},SCL=1;
function fit(){const W=innerWidth,H=innerHeight;SCL=Math.min(W/1920,H/1080);$('st').style.transform=`translate(${(W-1920*SCL)/2}px,${(H-1080*SCL)/2}px) scale(${SCL})`}addEventListener('resize',fit);fit();
const Z1=["🏘️ Keberagaman Sosial","🎭 Keberagaman Budaya"],Z2=["👍 Menghargai","👎 Tidak Menghargai"];
const R=[
{k:"Sosial atau Budaya?",ic:"🏘️",t:"sort",z:Z1,it:[["Tari Kecak dari Bali",1],["Tetangga kita ada petani, guru, dan pedagang",0],["Tari Saman dari Aceh",1],["Temanku beragama berbeda denganku",0],["Wayang kulit dari Jawa",1],["Tinggi badan dan bentuk rambut teman berbeda-beda",0],["Pakaian adat dan makanan khas daerah",1],["Bahasa daerah yang dipakai di rumah",1]]},
{k:"Hargai atau Tidak?",ic:"👍",t:"sort",z:Z2,it:[["Mengikuti upacara dengan tertib",0],["Mengejek pakaian adat daerah lain",1],["Menolong teman yang berbeda suku",0],["Memusuhi teman karena berbeda suku",1],["Memuji tarian dari daerah lain",0],["Merendahkan budaya daerah lain",1],["Mendengarkan pendapat semua teman",0],["Tidak mau bermain dengan teman beda agama",1]]},
{k:"Susun Semboyan",ic:"🧩",t:"ord",it:["Walaupun berbeda-beda, tetapi tetap satu jua","Bersatu kita teguh, bercerai kita runtuh"]},
{k:"Kuis Bhinneka",ic:"🦅",t:"q",it:[
["Bhinneka Tunggal Ika berarti ….",["perpecahan dalam perbedaan","keanekaragaman harus dipersatukan","walaupun berbeda-beda, tetapi tetap satu jua","perbedaan menimbulkan perpecahan"],2],
["Dewi memuji tarian Bali yang dibawakan Made. Sikap Dewi menunjukkan ….",["sikap merendahkan budaya lain","sikap menghargai keberagaman","sikap berlebihan membanggakan diri","sikap tidak peduli"],1],
["Semboyan itu dipakai karena keadaan bangsa kita mirip dengan Kerajaan ….",["Singosari","Kediri","Sriwijaya","Majapahit"],3],
["Bhinneka Tunggal Ika berasal dari bahasa ….",["Sansekerta","Inggris","Arab","Belanda"],0],
["Pita semboyan dicengkeram kaki burung ….",["Elang","Garuda","Merpati","Cendrawasih"],1],
["Satu lidi mudah patah, seikat lidi sulit patah. Pesannya ….",["Bersatu kita teguh","Bercerai kita teguh","Lidi untuk menyapu","Berjalan sendiri lebih kuat"],0]]}];
function sbr(){$('sb').innerHTML=S.T.map((m,i)=>`<div class=tm style="background:${TN[i][1]}"><b>Tim ${TN[i][0]}</b><span>${"<i></i>".repeat(Math.min(S.sc[i],24))}</span><em>${S.sc[i]}</em></div>`).join("")}
function home(){S.T=[];sbr();$('mn').innerHTML=`<div class=big>🪢</div><div class=t>Petualangan Seikat Lidi</div><div class=s>Keberagaman Sosial dan Budaya · Pendidikan Pancasila Kelas IV</div><button class=btn onclick="att()">👥 Cek Kehadiran dan Mulai ▶</button>`}
function att(){S.T=[];sbr();const P=N.filter((x,i)=>!S.abs[i]).length,ok=[3,5,7].filter(n=>P>=n*2);if(!ok.length)ok.push(2);if(!ok.includes(S.n))S.n=ok[ok.length-1];
$('mn').innerHTML=`<div class=t style="font-size:64px">Siapa yang hadir hari ini?</div><div class=s>Ketuk nama siswa yang tidak masuk · Hadir: ${P} dari ${N.length}</div><div class=at>${N.map((x,i)=>`<button class="ch ${S.abs[i]?"ab":""}" onclick="S.abs[${i}]=!S.abs[${i}];att()">${S.abs[i]?"✖":"✔"} ${x}</button>`).join("")}</div><div class=row style="align-items:center"><span class=s>Kelompok:</span>${ok.map(n=>`<button class="btn ${S.n==n?"":"g"}" style="padding:12px 34px" onclick="S.n=${n};att()">${n}</button>`).join("")}<button class=btn onclick="mk()">🎲 Acak Kelompok</button></div>`}
function mk(){const a=sh(N.filter((x,i)=>!S.abs[i]));S.T=Array.from({length:S.n},()=>[]);a.forEach((x,i)=>S.T[i%S.n].push(x));S.sc=S.T.map(()=>0);S.p=S.T.map(()=>0);S.turn=0;S.done={};S.sh=0;sbr();
$('mn').innerHTML=`<div class=t style="font-size:64px">Ini kelompok kita!</div><div class=row style="width:1800px">${S.T.map((m,i)=>`<div class=tc style="background:${TN[i][1]};animation-delay:${i*.18}s"><h3>Tim ${TN[i][0]}</h3>${m.map(x=>`<div>• ${x}</div>`).join("")}</div>`).join("")}</div><div class=row><button class="btn g" onclick="mk()">🔀 Acak Ulang</button><button class=btn onclick="hub()">Mulai Petualangan ▶</button></div>`}
function hub(){sbr();$('mn').innerHTML=`<div class=t>Pilih Misi</div><div class=row>${R.map((r,i)=>`<button class="rc ${S.done[i]?"dn":""}" onclick="go(${i})"><span>${r.ic}</span><b>${r.k}</b><small>${S.done[i]?"✔ Selesai":r.it.length+" soal"}</small></button>`).join("")}</div><button class="btn g" onclick="fin()">🏆 Podium Akhir</button>`}
function go(i){S.r=i;S.i=0;S.items=R[i].t=="sort"?sh(R[i].it):R[i].it;ask()}
function ask(){if(S.i>=S.items.length){if(S.r<0)return fin();S.done[S.r]=1;return hub()}
const r=S.r<0?TBR:R[S.r],t=S.r<0?S.tie[S.i]:S.turn++%S.n,m=S.T[t],who=m[S.p[t]++%m.length],it=S.items[S.i],c=S.cur={t,it,lock:0,ms:0,pos:0};let b;
if(r.t=="sort"){c.a=it[1];b=`<div class=card id=cd>${it[0]}</div><div class=hint>Seret kartu ke keranjang yang tepat (atau ketuk keranjangnya)</div><div class=zs>${r.z.map((x,j)=>`<div class="zn z${j}" onclick="pick(${j})">${x}</div>`).join("")}</div>`}
else if(r.t=="q"){c.a=it[2];b=`<div class=q>${it[0]}</div><div class=og>${it[1].map((o,j)=>`<button class="op o${j}" onclick="pick(${j})"><b>${"ABCD"[j]}</b>${o}</button>`).join("")}</div>`}
else{c.w=it.split(" ");b=`<div class=hint>Ketuk kata sesuai urutan yang benar</div><div class=ans id=an>…</div><div class=row style="max-width:1700px">${sh(c.w).map(w=>`<button class=tl onclick="tp(this)">${w}</button>`).join("")}</div>`}
$('mn').innerHTML=`<div class=pill style="background:${TN[t][1]}">Tim ${TN[t][0]} 🎯 Maju: <b id=wh>${who}</b></div>${b}<div id=fb></div>`;
let k=0;const iv=setInterval(()=>{const e=$('wh');if(!e||k>8){clearInterval(iv);if(e)e.textContent=who;return}e.textContent=m[k++%m.length]},80);
if(r.t=="sort")drag($('cd'))}
function end(ok,msg){const c=S.cur;c.lock=1;if(ok){S.sc[c.t]++;sbr()}$('fb').innerHTML=`<div class=fbr><span class=${ok?"ok":"no"}>${ok?"🎉":"💪"} ${msg}</span><button class=btn onclick="S.i++;ask()">Lanjut ▶</button></div>`}
function pick(j){const c=S.cur;if(c.lock)return;const L=document.querySelectorAll("#mn .op,#mn .zn"),ok=j==c.a;L[c.a].classList.add("cor");if(!ok)L[j].classList.add("bad");
end(ok,S.r>=0&&R[S.r].t=="sort"?(ok?"Tepat! ":"Yang benar: ")+R[S.r].z[c.a]:ok?"Benar sekali!":"Jawaban yang benar: "+"ABCD"[c.a])}
function tp(b){const c=S.cur;if(c.lock)return;if(b.textContent==c.w[c.pos]){c.pos++;b.disabled=true;$('an').textContent=c.w.slice(0,c.pos).join(" ");if(c.pos==c.w.length){const ok=c.ms<=2;end(ok,ok?"Hebat! Semboyan tersusun!":"Tersusun, tetapi masih banyak salah ketuk.")}}else{c.ms++;b.classList.add("shk");setTimeout(()=>b.classList.remove("shk"),400)}}
function drag(c){let sx,sy,on=0;c.onpointerdown=e=>{if(S.cur.lock)return;on=1;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add("dg")};
c.onpointermove=e=>{if(on)c.style.transform=`translate(${(e.clientX-sx)/SCL}px,${(e.clientY-sy)/SCL}px) rotate(-3deg)`};
c.onpointerup=e=>{if(!on)return;on=0;c.style.visibility="hidden";const z=document.elementFromPoint(e.clientX,e.clientY),zn=z&&z.closest(".zn");c.style.visibility="";c.classList.remove("dg");c.style.transform="";if(zn)pick(+zn.classList.contains("z1"))}}
const TB=[["Tari Kecak dari Bali termasuk contoh keberagaman ….",["sosial","budaya","profesi","agama"],1],["Saat temanmu sedang beribadah, sikap yang benar adalah ….",["bermain dan ribut","mengejek","tidak ribut","pergi begitu saja"],2],["Ikut memikirkan perasaan orang lain sebelum berbicara disebut ….",["tenggang rasa","tidak peduli","berlebihan","bercerai"],0],["Tari Saman berasal dari daerah ….",["Bali","Jawa","Papua","Aceh"],3],["Jika menjadi pendatang di daerah lain, kita sebaiknya ….",["merendahkan budaya setempat","menyesuaikan diri dan belajar budaya setempat","tidak mau bergaul","memaksakan budaya sendiri"],1],["Keberagaman suku, budaya, dan agama seharusnya membuat kita ….",["semakin bersatu","saling memusuhi","menjauh","bercerai"],0]],TBR={k:"Babak Penentu",ic:"⚔️",t:"q",it:TB};let tbi=0;
function tbr(t){S.tie=t;S.r=-1;S.i=0;S.items=t.map(()=>TB[tbi++%TB.length]);ask()}
function fin(){const o=S.T.map((_,i)=>i).sort((a,b)=>S.sc[b]-S.sc[a]),rk=i=>o.findIndex(j=>S.sc[j]==S.sc[i]),tied=o.filter(i=>S.sc[i]==S.sc[o[0]]),tie=tied.length>1&&S.sc[o[0]]>0&&!S.sh;$('mn').innerHTML=`<div class=t style="font-size:68px">🏆 Podium Akhir</div>${tie?`<div class=s style="color:var(--ink)">Seri di puncak: ${tied.map(i=>"Tim "+TN[i][0]).join(" & ")}!</div>`:""}${S.sh&&tied.length>1?'<div class=s style="color:var(--ink)">🤝 Juara bersama!</div>':""}${o.map((i,k)=>`<div class=pd style="background:${TN[i][1]}"><b>${["🥇","🥈","🥉"][rk(i)]||rk(i)+1}</b><span>Tim ${TN[i][0]}</span><b>${S.sc[i]} lidi</b></div>`).join("")}<div class=s>Satu lidi mudah patah, seikat lidi sulit dipatahkan. Indonesia kuat karena bersatu!</div><div class=row>${tie?`<button class=btn onclick="tbr([${tied}])">⚔️ Babak Penentu</button><button class="btn g" onclick="S.sh=1;fin()">🤝 Juara Bersama</button>`:""}<button class="btn g" onclick="hub()">↩ Kembali ke Misi</button><button class=btn onclick="home()">🔁 Main Lagi</button></div>`}
home();
</script></body></html>
